<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Terminal</title>
<!-- Notion에 임베드하는 접속 버튼. 칸 높이가 얼마든 가운데에 버튼이 오도록 바탕 전체를 격자 패널로 채운다. -->
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0b1521; overflow: hidden; font-family: Inter, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
  a {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-decoration: none; color: #edf5fa; cursor: pointer;
    background:
      linear-gradient(#8bd3e80d 1px, transparent 1px) 0 0 / 26px 26px,
      linear-gradient(90deg, #8bd3e80d 1px, transparent 1px) 0 0 / 26px 26px,
      radial-gradient(60% 80% at 50% 50%, rgba(139, 211, 232, 0.14), transparent 70%),
      linear-gradient(140deg, #09131e, #112131 55%, #0a1521);
  }
  .corner { position: absolute; width: 22px; height: 22px; border: 0 solid #527c94; }
  .c1 { left: 14px; top: 14px; border-width: 2px 0 0 2px; } .c2 { right: 14px; top: 14px; border-width: 2px 2px 0 0; }
  .c3 { left: 14px; bottom: 14px; border-width: 0 0 2px 2px; } .c4 { right: 14px; bottom: 14px; border-width: 0 2px 2px 0; }
  .top { position: absolute; left: 44px; top: 18px; right: 44px; display: flex; justify-content: space-between;
         font-size: 10px; letter-spacing: .18em; font-weight: 800; color: #8bd3e8; }
  .top b { color: #88d3b1; font-weight: 800; }
  .title { font-size: clamp(26px, 6vw, 46px); font-weight: 900; letter-spacing: -.04em; line-height: 1; }
  .title span { color: #8bd3e8; }
  .btn {
    display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 8px;
    background: #21445c; border: 1px solid #527c94; box-shadow: 0 0 0 4px #8bd3e812;
    font-size: 13px; font-weight: 800; letter-spacing: .14em; transition: .15s;
  }
  .btn i { width: 8px; height: 8px; border-radius: 50%; background: #88d3b1; box-shadow: 0 0 8px #88d3b1; }
  a:hover .btn { border-color: #8bd3e8; color: #8bd3e8; transform: translateY(-2px); box-shadow: 0 0 0 4px #8bd3e822, 0 0 24px #8bd3e833; }
  a:active .btn { transform: translateY(1px); }
  .url { font-size: 11px; letter-spacing: .1em; color: #9db1c0; }
  .hint { position: absolute; bottom: 18px; font: 10px/1 ui-monospace, Consolas, monospace; letter-spacing: .16em; color: #8bd3e8;
          animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-height: 200px) { .top, .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
  <a href="https://bgm20054.github.io/" target="_blank" rel="noopener" aria-label="웹 포트폴리오 열기">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <div class="top"><span>TACTICAL ARCHIVE / WEB TERMINAL</span><b>● SYSTEM ONLINE</b></div>
    <div class="title">TACTICAL <span>ARCHIVE.</span></div>
    <div class="btn"><i></i>OPEN WEB PORTFOLIO ↗</div>
    <div class="url">bgm20054.github.io</div>
    <div class="hint">▶ CLICK TO ACCESS</div>
  </a>
</body>
</html>
